services:
  db-eventos:
    image: postgres:16-alpine
    container_name: db-eventos
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventos}
      POSTGRES_USER: ${POSTGRES_USER:-eventos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventos123}
    volumes:
      - eventos_data:/var/lib/postgresql/data
    networks:
      - eventos_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventos-backend
    restart: unless-stopped
    environment:
      - PORT=${PORT:-8083}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-eventos:5432/${POSTGRES_DB:-eventos}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-eventos}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-eventos123}
    ports:
      - "${PORT:-8083}:8083"
    depends_on:
      db-eventos:
        condition: service_healthy
    networks:
      - eventos_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eventos_data:
    name: eventos_data

networks:
  eventos_net:
    name: eventos_net
